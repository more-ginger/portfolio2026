  <!-- The pretzel logo from /uploads/about/about-logo.svg, re-centred on a
       square canvas. The source artwork is 50x38, so dropping it into a
       favicon unchanged would squash it to fit a square tab icon; the
       translate below centres it instead, leaving even padding on all sides.

       The amber plate matters as much as the mark: the pretzel is red-900,
       which all but disappears against a dark browser chrome. Painting the
       site's own background behind it keeps the icon legible in both
       light and dark themes, and matches the header it's taken from. -->
